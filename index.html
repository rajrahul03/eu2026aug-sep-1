<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EU Trip 2026 | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 115, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(72, 209, 204, 0.2) 0%, transparent 50%);
            animation: aurora 8s ease-in-out infinite alternate;
        }
        @keyframes aurora {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }
        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            margin: 1rem;
            text-align: center;
        }
        .login-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #fff 0%, #a8edea 50%, #fed6e3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .login-card .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .error {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
        .error.show { display: block; }
        .emoji-route {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="emoji-route">🇩🇰 🇳🇴 🇸🇪 🇫🇮 🇪🇪 🇱🇹 🇵🇱</div>
        <h1>Europe 2026</h1>
        <p class="subtitle">Enter credentials to access the trip itinerary</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">Access Itinerary →</button>
            <p class="error" id="error">Invalid credentials. Please try again.</p>
        </form>
    </div>

    <script>
        // If already authenticated, redirect directly
        (function() {
            var auth = sessionStorage.getItem('eu2026_auth');
            var ts = parseInt(sessionStorage.getItem('eu2026_ts') || '0');
            if (auth === 'true' && (Date.now() - ts) < 86400000) {
                window.location.href = 'trip.html';
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;

            // Verify credentials using hash comparison
            var combo = username + ':' + password;
            var encoder = new TextEncoder();
            var data = encoder.encode(combo);
            var hashBuffer = await crypto.subtle.digest('SHA-256', data);
            var hashArray = Array.from(new Uint8Array(hashBuffer));
            var hash = hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');

            // SHA-256 of credentials
            if (hash === 'd4460eb398678b1047289eb71124db60645d05126b3aee8f5a59d934420402c1') {
                sessionStorage.setItem('eu2026_auth', 'true');
                sessionStorage.setItem('eu2026_ts', Date.now().toString());
                window.location.href = 'trip.html';
            } else {
                document.getElementById('error').classList.add('show');
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
